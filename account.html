<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Nexus Gear</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0d14;
      --bg-card: #131622;
      --border-color: #232738;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-purple: #7c5dfa;
      --accent-yellow: #f4d03f;
      --accent-green: #2ecc71;
      --accent-red: #ff4757;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: var(--bg-dark); 
      color: var(--text-main); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar { background: #08090e; border-bottom: 1px solid var(--border-color); padding: 16px 0; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .nav-flex { display: flex; justify-content: space-between; align-items: center; }
    .brand-logo { font-size: 1.6rem; font-weight: 800; color: #fff; text-decoration: none; }
    .brand-logo span { color: var(--accent-purple); }

    .account-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      margin: 40px auto;
    }

    .account-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .avatar-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(124, 93, 250, 0.15);
      color: var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 12px;
    }

    .btn-logout {
      width: 100%;
      padding: 12px;
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .order-history-card {
      background: #0a0b10;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-Pending { background: rgba(244, 208, 63, 0.15); color: var(--accent-yellow); }
    .badge-Processing { background: rgba(124, 93, 250, 0.15); color: var(--accent-purple); }
    .badge-Delivered { background: rgba(46, 204, 113, 0.15); color: var(--accent-green); }

    @media (max-width: 768px) {
      .account-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="container nav-flex">
      <a href="index.html" class="brand-logo"><span>NEXUS</span>GEAR.</a>
      <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-weight:600;">
        <i class="fa-solid fa-store"></i> Return to Store
      </a>
    </div>
  </header>

  <div class="container">
    <div class="account-layout">
      
      <!-- Left Sidebar: Customer Profile Info -->
      <div>
        <div class="account-card">
          <div class="profile-header">
            <div class="avatar-icon"><i class="fa-solid fa-user-astronaut"></i></div>
            <h3 id="user-name" style="color:#fff;">Loading...</h3>
            <p id="user-phone" style="color:var(--text-muted); font-size:0.88rem;"></p>
          </div>

          <div style="margin-bottom: 20px;">
            <label style="color:var(--text-muted); font-size:0.8rem; display:block; margin-bottom:4px;">Default Delivery Address:</label>
            <p id="user-address" style="color:#fff; font-size:0.9rem; font-weight:500;">-</p>
          </div>

          <button onclick="logoutCustomer()" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Log Out
          </button>
        </div>
      </div>

      <!-- Right Main Area: Order History List -->
      <div>
        <div class="account-card">
          <h2 style="color:#fff; margin-bottom:20px; display:flex; align-items:center; gap:10px;">
            <i class="fa-solid fa-boxes-packing" style="color:var(--accent-purple);"></i> My Order History
          </h2>

          <div id="orders-list-container">
            <p style="color:var(--text-muted);">Fetching your orders...</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const isLoggedIn = localStorage.getItem('customer_logged_in') === 'true';
      const customer = JSON.parse(localStorage.getItem('ggez_customer'));

      if (!isLoggedIn || !customer) {
        alert("Please log in to view your account.");
        window.location.href = "user-auth.html?redirect=account.html";
        return;
      }

      // Display User Info
      document.getElementById('user-name').textContent = customer.name || "Customer";
      document.getElementById('user-phone').textContent = customer.phone || "N/A";
      document.getElementById('user-address').textContent = customer.address || "No address saved";

      // Load Orders
      fetchCustomerOrders(customer.phone);
    });

    async function fetchCustomerOrders(phone) {
      const container = document.getElementById('orders-list-container');

      try {
        const res = await fetch(`/api/orders/user/${encodeURIComponent(phone)}`);
        const data = await res.json();

        if (data.success && data.orders.length > 0) {
          container.innerHTML = data.orders.reverse().map(order => `
            <div class="order-history-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <div>
                  <strong style="color:#fff;">Order #${order.id}</strong>
                  <span style="color:var(--text-muted); font-size:0.8rem; display:block;">Date: ${order.date || 'N/A'}</span>
                </div>
                <span class="status-badge badge-${order.status}">${order.status}</span>
              </div>

              <div style="margin-bottom:12px; font-size:0.9rem; color:var(--text-main);">
                <span style="color:var(--text-muted);">Items:</span> ${order.items}
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; border-top:1px solid var(--border-color); padding-top:10px;">
                <span style="color:var(--text-muted);">Total Paid: <strong style="color:var(--accent-yellow);">৳ ${order.total.toLocaleString()}</strong></span>
                <a href="track.html" style="color:var(--accent-purple); text-decoration:none; font-weight:600; font-size:0.85rem;">
                  Track Order <i class="fa-solid fa-arrow-right"></i>
                </a>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div style="text-align:center; padding:30px 0; color:var(--text-muted);">
              <i class="fa-solid fa-bag-shopping" style="font-size:2.5rem; margin-bottom:10px; display:block;"></i>
              <p>You haven't placed any orders yet.</p>
              <a href="index.html" style="color:var(--accent-purple); font-weight:700; text-decoration:none; margin-top:8px; display:inline-block;">Start Shopping</a>
            </div>
          `;
        }
      } catch (err) {
        console.error("Error fetching orders:", err);
        container.innerHTML = `<p style="color:var(--accent-red);">Failed to load order history.</p>`;
      }
    }

    function logoutCustomer() {
      localStorage.removeItem('customer_logged_in');
      localStorage.removeItem('ggez_customer');
      alert("Logged out successfully.");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
