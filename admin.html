<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Nexus Gear</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    .admin-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 30px;
      max-width: 1280px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .admin-sidebar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      height: fit-content;
    }

    .admin-nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text-muted);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition-fast);
      border: none;
      cursor: pointer;
    }

    .admin-nav-btn:hover, .admin-nav-btn.active {
      background: var(--accent-purple);
      color: #fff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 28px;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-control {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px;
      color: #fff;
      font-family: inherit;
    }
    .full-width { grid-column: 1 / -1; }

    .inventory-toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
    .admin-table th, .admin-table td { padding: 14px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .admin-table th { background: var(--bg-secondary); color: var(--text-muted); }
    .admin-table img { width: 45px; height: 45px; object-fit: contain; background: var(--bg-secondary); border-radius: 6px; }
    
    .btn-action { padding: 6px 10px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; }
    .btn-edit { background: rgba(124, 93, 250, 0.2); color: var(--accent-purple); margin-right: 6px; }
    .btn-edit:hover { background: var(--accent-purple); color: #fff; }
    .btn-danger { background: rgba(255, 71, 87, 0.2); color: var(--accent-red); }
    .btn-danger:hover { background: var(--accent-red); color: #fff; }

    /* Modal Popup Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center; justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 28px;
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo"><span>NEXUS</span>GEAR.</a>
      <div class="flex-between" style="gap:15px;">
        <a href="index.html" style="color:var(--text-muted); font-weight:600;"><i class="fa-solid fa-store"></i> View Store</a>
        <button onclick="logout()" class="btn-action btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    
    <aside class="admin-sidebar">
      <h3 style="font-size:0.9rem; color:var(--text-muted); margin-bottom:15px; text-transform:uppercase;">Management</h3>
      <button class="admin-nav-btn active" onclick="switchTab('orders-tab', this)">
        <i class="fa-solid fa-clock-rotate-left"></i> Customer Orders
      </button>
      <button class="admin-nav-btn" onclick="switchTab('products-tab', this)">
        <i class="fa-solid fa-boxes-stacked"></i> Inventory & Products
      </button>
    </aside>

    <main class="admin-main">

      <!-- ORDERS TAB -->
      <section id="orders-tab" class="tab-content active">
        <div class="admin-card">
          <h2><i class="fa-solid fa-receipt" style="color:var(--accent-yellow);"></i> Customer Orders</h2>
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orders-list"></tbody>
          </table>
        </div>
      </section>

      <!-- PRODUCTS TAB -->
      <section id="products-tab" class="tab-content">
        
        <!-- ADD PRODUCT FORM -->
        <div class="admin-card">
          <h2><i class="fa-solid fa-plus-circle" style="color:var(--accent-purple);"></i> Add New Product</h2>
          <form id="add-product-form">
            <div class="form-grid">
              <div class="form-group full-width">
                <label>Product Name *</label>
                <input type="text" id="p-name" class="form-control" required placeholder="AULA F75 Keyboard">
              </div>

              <div class="form-group">
                <label>Category *</label>
                <select id="p-category" class="form-control" required>
                  <option value="" disabled selected>-- Select --</option>
                  <option value="Keyboards">Keyboards</option>
                  <option value="Mice">Mice</option>
                  <option value="Monitors">Monitors</option>
                  <option value="Audio">Audio</option>
                  <option value="Gamepads">Gamepads</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>

              <div class="form-group">
                <label>Brand Name *</label>
                <input type="text" id="p-brand" class="form-control" required placeholder="AULA">
              </div>

              <div class="form-group">
                <label>Price (৳) *</label>
                <input type="number" id="p-price" class="form-control" required placeholder="5250">
              </div>

              <!-- Multiple Images Field -->
              <div class="form-group full-width">
                <label>Image URLs (At least 1 required, separate multiple URLs with commas or new lines) *</label>
                <textarea id="p-images" class="form-control" rows="2" required placeholder="https://image1.jpg, https://image2.jpg"></textarea>
              </div>

              <!-- Description Field -->
              <div class="form-group full-width">
                <label>Product Description</label>
                <textarea id="p-desc" class="form-control" rows="3" placeholder="Write detailed product summary..."></textarea>
              </div>

              <!-- Specification Field -->
              <div class="form-group full-width">
                <label>Technical Specifications</label>
                <textarea id="p-spec" class="form-control" rows="3" placeholder="Connectivity: Bluetooth&#10;Battery: 4000mAh"></textarea>
              </div>

              <!-- NEW: Homepage Display Badges / Checkboxes -->
              <div class="form-group full-width" style="display: flex; gap: 20px; margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; font-size: 0.9rem;">
                  <input type="checkbox" id="p-is-new" style="accent-color: var(--accent-purple); width: 16px; height: 16px;" checked>
                  <span>Mark as <strong>Trending / New</strong></span>
                </label>

                <label style="display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; font-size: 0.9rem;">
                  <input type="checkbox" id="p-is-featured" style="accent-color: var(--accent-yellow); width: 16px; height: 16px;">
                  <span>Mark as <strong>Featured Item</strong></span>
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:20px;">Save Product</button>
          </form>
        </div>

        <!-- INVENTORY TABLE -->
        <div class="admin-card">
          <h2><i class="fa-solid fa-list" style="color:var(--accent-purple);"></i> Current Inventory</h2>
          
          <div class="inventory-toolbar" style="margin-top:15px;">
            <input type="text" id="inv-search" class="form-control" placeholder="🔍 Search..." oninput="filterInventory()" style="max-width:200px;">
            <select id="inv-category-filter" class="form-control" onchange="filterInventory()" style="max-width:160px;">
              <option value="ALL">All Categories</option>
              <option value="Keyboards">Keyboards</option>
              <option value="Mice">Mice</option>
              <option value="Monitors">Monitors</option>
              <option value="Audio">Audio</option>
              <option value="Gamepads">Gamepads</option>
            </select>
          </div>

          <table class="admin-table">
            <thead>
              <tr>
                <th>Image</th>
                <th>Title</th>
                <th>Category</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="inventory-list"></tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

<!-- EDIT PRODUCT MODAL -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="flex-between" style="margin-bottom:20px;">
        <h2><i class="fa-solid fa-pen-to-square" style="color:var(--accent-purple);"></i> Edit Product</h2>
        <button onclick="closeEditModal()" class="btn-action btn-danger" style="padding:4px 8px;">✕</button>
      </div>

      <form id="edit-product-form">
        <input type="hidden" id="edit-p-id">
        <div class="form-grid">
          <div class="form-group full-width">
            <label>Product Name *</label>
            <input type="text" id="edit-p-name" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Category *</label>
            <select id="edit-p-category" class="form-control" required>
              <option value="Keyboards">Keyboards</option>
              <option value="Mice">Mice</option>
              <option value="Monitors">Monitors</option>
              <option value="Audio">Audio</option>
              <option value="Gamepads">Gamepads</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>

          <div class="form-group">
            <label>Brand *</label>
            <input type="text" id="edit-p-brand" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Price (৳) *</label>
            <input type="number" id="edit-p-price" class="form-control" required>
          </div>

          <div class="form-group full-width">
            <label>Image URLs (Comma separated) *</label>
            <textarea id="edit-p-images" class="form-control" rows="2" required></textarea>
          </div>

          <div class="form-group full-width">
            <label>Description</label>
            <textarea id="edit-p-desc" class="form-control" rows="3"></textarea>
          </div>

          <div class="form-group full-width">
            <label>Specifications</label>
            <textarea id="edit-p-spec" class="form-control" rows="3"></textarea>
          </div>

          <!-- NEW: Homepage Display Badges / Checkboxes -->
          <div class="form-group full-width" style="display: flex; gap: 20px; margin-top: 10px;">
            <label style="display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; font-size: 0.9rem;">
              <input type="checkbox" id="edit-p-is-new" style="accent-color: var(--accent-purple); width: 16px; height: 16px;">
              <span>Mark as <strong>Trending / New</strong></span>
            </label>

            <label style="display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; font-size: 0.9rem;">
              <input type="checkbox" id="edit-p-is-featured" style="accent-color: var(--accent-yellow); width: 16px; height: 16px;">
              <span>Mark as <strong>Featured Item</strong></span>
            </label>
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="submit" class="btn btn-primary">Update Product</button>
          <button type="button" onclick="closeEditModal()" class="btn-action btn-danger">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allProducts = [];

    if (localStorage.getItem('admin_logged_in') !== 'true') {
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('admin_logged_in');
      window.location.href = 'login.html';
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Helper to parse comma/newline separated image URLs
    function parseImageUrls(text) {
      return text.split(/[\n,]+/).map(url => url.trim()).filter(url => url.length > 0);
    }

    // Load Orders
    async function loadOrders() {
      const res = await fetch('/api/orders');
      const orders = await res.json();
      const tbody = document.getElementById('orders-list');
      tbody.innerHTML = '';

      orders.forEach(o => {
        tbody.innerHTML += `
          <tr>
            <td>#${o.id}</td>
            <td><strong>${o.customer}</strong><br><small style="color:var(--text-muted);">${o.phone}</small></td>
            <td>${o.items}</td>
            <td style="color:var(--accent-yellow); font-weight:700;">৳ ${o.total.toLocaleString()}</td>
            <td><span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span></td>
            <td>
              <select onchange="updateOrderStatus(${o.id}, this.value)" style="background:var(--bg-secondary); color:#fff; border:1px solid var(--border-color); padding:4px; border-radius:4px;">
                <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                <option value="Processing" ${o.status==='Processing'?'selected':''}>Processing</option>
                <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
              </select>
            </td>
          </tr>
        `;
      });
    }

    async function updateOrderStatus(id, status) {
      await fetch(`/api/orders/${id}/status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadOrders();
    }

    // Load Products
    async function loadInventory() {
      const res = await fetch('/api/products');
      allProducts = await res.json();
      filterInventory();
    }

    function filterInventory() {
      const searchVal = document.getElementById('inv-search').value.toLowerCase();
      const catVal = document.getElementById('inv-category-filter').value;

      let filtered = [...allProducts];
      if (searchVal) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchVal));
      if (catVal !== 'ALL') filtered = filtered.filter(p => p.category === catVal);

      renderInventoryTable(filtered);
    }

    function renderInventoryTable(products) {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = '';

      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No products found.</td></tr>`;
        return;
      }

      products.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td><img src="${p.image}"></td>
            <td><strong>${p.name}</strong></td>
            <td>${p.category}</td>
            <td>${p.brand || '—'}</td>
            <td style="color:var(--accent-yellow); font-weight:700;">৳ ${p.price.toLocaleString()}</td>
            <td>
              <button class="btn-action btn-edit" onclick="openEditModal(${p.id})"><i class="fa-solid fa-pen"></i> Edit</button>
              <button class="btn-action btn-danger" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // Add Product Form
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const images = parseImageUrls(document.getElementById('p-images').value);

      const newProduct = {
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-category').value,
        brand: document.getElementById('p-brand').value,
        price: parseFloat(document.getElementById('p-price').value),
        images: images,
        image: images[0] || '',
        description: document.getElementById('p-desc').value,
        specifications: document.getElementById('p-spec').value,
        isNew: document.getElementById('p-is-new').checked,
        isFeatured: document.getElementById('p-is-featured').checked
      };

      try {
        const response = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newProduct)
        });

        if (!response.ok) throw new Error('Network response was not ok');

        e.target.reset();
        alert('Product added successfully!');
        loadInventory();
      } catch (error) {
        console.error('Error adding product:', error);
        alert('Failed to save product. Please ensure the backend server (node server.js) is running and you are accessing the site via http://localhost:3000');
      }
    });

    // Open Edit Modal with existing data
    function openEditModal(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('edit-p-id').value = p.id;
      document.getElementById('edit-p-name').value = p.name;
      document.getElementById('edit-p-category').value = p.category;
      document.getElementById('edit-p-brand').value = p.brand || '';
      document.getElementById('edit-p-price').value = p.price;
      document.getElementById('edit-p-images').value = (p.images && p.images.length > 0) ? p.images.join(',\n') : p.image;
      document.getElementById('edit-p-desc').value = p.description || '';
      document.getElementById('edit-p-spec').value = p.specifications || '';

      document.getElementById('edit-p-is-new').checked = p.isNew || false;
      document.getElementById('edit-p-is-featured').checked = p.isFeatured || false;

      document.getElementById('edit-modal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    // Submit Edit Form
    document.getElementById('edit-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('edit-p-id').value;
      const images = parseImageUrls(document.getElementById('edit-p-images').value);

      const updatedProduct = {
        name: document.getElementById('edit-p-name').value,
        category: document.getElementById('edit-p-category').value,
        brand: document.getElementById('edit-p-brand').value,
        price: parseFloat(document.getElementById('edit-p-price').value),
        images: images,
        image: images[0] || '',
        description: document.getElementById('edit-p-desc').value,
        specifications: document.getElementById('edit-p-spec').value,
        isNew: document.getElementById('edit-p-is-new').checked,
        isFeatured: document.getElementById('edit-p-is-featured').checked
      };

      try {
        const response = await fetch(`/api/products/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedProduct)
        });
        
        if (!response.ok) throw new Error('Network response was not ok');

        closeEditModal();
        alert('Product updated successfully!');
        loadInventory();
      } catch (error) {
        console.error('Error updating product:', error);
        alert('Failed to update product. Please ensure the backend server is running.');
      }
    });

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      try {
        const response = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        if (!response.ok) throw new Error('Network response was not ok');
        alert('Product deleted successfully!');
        loadInventory();
      } catch (error) {
        console.error('Error deleting product:', error);
        alert('Failed to delete product. Please ensure the backend server is running.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders();
      loadInventory();
    });
  </script>
</body>
</html>
